<!DOCTYPE html>
<html>
  <head>
    <title>My 3D GitHub Page</title>
    <!-- Include the A-Frame Library -->
    <script src="https://aframe.io"></script>
  </head>
  <body>
    <!-- Define the 3D Scene -->
    <a-scene>
      <!-- A 3D Box (Cube) -->
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9" animation="property: rotation; to: 0 405 0; loop: true; dur: 5000"></a-box>
      
      <!-- A 3D Sphere -->
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      
      <!-- A 3D Cylinder -->
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      
      <!-- The Ground plane -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      
      <!-- The Sky background color -->
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
